name: Deploy to GitHub Pages

# The portfolio moved to https://dhrupeshbrahmbhatt.github.io/portfolio/ (repo: portfolio).
# This site now publishes only a redirect page so old links (CV, job applications) land there.
# The previous site's source is unchanged in this repo; restore the build steps to bring it back.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
